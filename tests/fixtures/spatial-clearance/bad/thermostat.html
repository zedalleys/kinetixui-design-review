<!-- Gauge: 200x200 box, arc stroke 16 centered on a 92px radius => outer ring edge at 100px from centre -->
<div class="dial" style="position:relative;width:200px;height:200px">
  <svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="16"/></svg>
  <!-- minus button: 44x44 hit area, left edge at x=12, so it sits ON the ring (ring spans x=0..16 at y=100) -->
  <button style="position:absolute;left:12px;top:78px;width:44px;height:44px" aria-label="Decrease">−</button>
  <button style="position:absolute;left:144px;top:78px;width:44px;height:44px" aria-label="Increase">+</button>
</div>
